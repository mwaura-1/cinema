<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cinema_ctd.css">
</head>

<body>
    <header>
        <h1><b>BUY TICKET</b> </h1>
    </header>
    <form id="booking form">
        <label for="Email">Email:</label>
        <input type="text" id="Email" minlength="6" maxlength="20" required>

        <label for="phone_number">phone number:</label>
        <input type="tel" id="phone_number" required><br>

        <h2>Choose Your Movie</h2>

        <div class="movies">
            <button type="button" class="movie" data-movie="pulp  fiction"><img src="pulp.jpg" height="320" width="250">
                <p>pulp fiction</p>
            </button>

            <button type="button" class="movie" data-movie="black swan"><img src="black swan.jpeg" height="320"
                    width="250">
                <p>black swan</p>
            </button>

            <button type="button" class="movie" data-movie="almost famous"><img src="almost_famous.jpg" height="320"
                    width="250">
                <p>almost famous</p>
            </button>
        </div>
        <p id="selected-movie">Choose a movie to begin</p>
    </form>




    <script src="cinema.js"></script>

</body>

</html>
